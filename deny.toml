# cargo-deny config (`cargo deny check`, wired into CI's `test` gate).
# Checks four things: known security advisories, license compatibility
# with Apache-2.0 distribution, banned/duplicate crates, and that every
# dependency actually comes from crates.io.

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    # rmcp requires chrono on every target, in its newest release too, so chrono
    # stays in the graph after Yunta's own code moves off it. The entry goes when
    # rmcp publishes a release that builds without chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono still arrives through rmcp, which requires it" },
]

[licenses]
# Permissive licenses only — no copyleft, no source-available terms. Every
# license actually present in the dependency graph must be listed here or
# `cargo deny check licenses` fails; a new dependency that pulls in
# something else is a decision to make explicitly, not silently pass.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    # Mozilla's root certificate bundle (webpki-root-certs), vendored as
    # data by the rustls stack — a data license, not a code copyleft.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# The default hasher of hashbrown, which Ratatui's `lru` turns on for every crate
# that shares hashbrown: a permissive license, allowed for this crate alone.
[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

[licenses.private]
ignore = false

[bans]
# A second version of a crate is a decision, never a drift: every one is
# named here with the reason it stays until its upstream converges.
multiple-versions = "deny"
wildcards = "deny"
allow-workspace = true
skip = [
    # Proc-macro crates in the tree still split between syn 2 and syn 3.
    { crate = "syn:2.0.119", reason = "derive macros split between syn 2 and 3" },
    # process-wrap, behind the child-process transport rmcp gives the CLI's stdio
    # test, still requires nix 0.31 while Yunta's own process code uses 0.32. Both
    # old versions here reach tests only; the release binary holds one of each.
    { crate = "nix:0.31.4", reason = "rmcp's process-wrap lags yunta on nix" },
    # Indicatif's in-memory terminal, which the CLI's tests draw progress into,
    # still requires vt100 0.16 while the terminal harness reads screens with 0.18.
    { crate = "vt100:0.16.2", reason = "indicatif's in-memory terminal lags the test harness on vt100" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
