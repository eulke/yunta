# cargo-deny config (`cargo deny check`, wired into CI's `test` gate).
# Checks four things: known security advisories, license compatibility
# with Apache-2.0 distribution, banned/duplicate crates, and that every
# dependency actually comes from crates.io.

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
# Permissive licenses only — no copyleft, no source-available terms. Every
# license actually present in the dependency graph must be listed here or
# `cargo deny check licenses` fails; a new dependency that pulls in
# something else is a decision to make explicitly, not silently pass.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    # Mozilla's root certificate bundle (webpki-root-certs), vendored as
    # data by the rustls stack — a data license, not a code copyleft.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
# A second version of a crate is a decision, never a drift: every one is
# named here with the reason it stays until its upstream converges.
multiple-versions = "deny"
wildcards = "deny"
allow-workspace = true
skip = [
    # Proc-macro crates in the tree still split between syn 2 and syn 3.
    { crate = "syn:2.0.119", reason = "derive macros split between syn 2 and 3" },
    # bindgen, a build dependency of libproc, still requires shlex 1 while cc
    # requires 2.
    { crate = "shlex:1.3.0", reason = "libproc's bindgen lags cc on shlex" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
