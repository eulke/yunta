# cargo-deny config (`cargo deny check`, wired into CI's `test` gate per
# RFC-0004 §4.1). Checks four things: known security advisories, license
# compatibility with Apache-2.0 distribution, banned/duplicate crates, and
# that every dependency actually comes from crates.io.

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
# Permissive licenses only — no copyleft, no source-available terms. Every
# license actually present in the dependency graph must be listed here or
# `cargo deny check licenses` fails; a new dependency that pulls in
# something else is a decision to make explicitly, not silently pass.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    # Mozilla's root certificate bundle (webpki-root-certs), vendored as
    # data by the rustls stack — a data license, not a code copyleft.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
