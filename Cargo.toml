[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/adapters",
    "crates/engine",
    "crates/cli",
    "crates/testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/eulke/yunta"

# Every dependency's version lives here once; a crate opts in with
# `workspace = true` and adds only the features it uses. Internal
# crates carry `version` because crates.io rejects a path dependency
# without one.
[workspace.dependencies]
yunta-core = { path = "crates/core", version = "0.1.0" }
yunta-storage = { path = "crates/storage", version = "0.1.0" }
yunta-adapters = { path = "crates/adapters", version = "0.1.0" }
yunta-engine = { path = "crates/engine", version = "0.1.0" }
# Test-support crate: dev-dependency only, never published, so no version.
yunta-testkit = { path = "crates/testkit" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
base64 = "0.22"
chrono = "0.4"
clap = "4"
futures = "0.3"
globset = "0.4"
indexmap = "2"
nix = { version = "0.31", features = ["signal", "process"] }
regex = "1"
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "3", default-features = false }
rusqlite = "0.32"
schemars = "1"
serde = "1"
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = "3"
uuid = "1"

# Lints apply to every crate, tests included, through `[lints]
# workspace = true` in each manifest.
[workspace.lints.rust]
unsafe_code = "forbid"

# The static binary is a feature of the product: every release build
# pays for whole-program optimization and ships without symbols. A panic
# is a bug, never a state to unwind through, so the binary carries no
# unwinding code either.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
