name: fragua
publisher: yunta
version: 0.1.0
description: >-
  The full reference pipeline: an ambiguity-resolving grill, a plan
  registered as a verified tasks document, the tests its tasks are held to
  written before any is built, implementation checked task by task, a
  two-runner review beside a check of the work against the plan a person
  approved, one round of fixes, a lint→fix cycle, a baseline check, a PR —
  open modes throughout, and the plan distilled to knowledge on finish.
  Installable and removable like any third-party pack; the engine
  never treats it specially.
license: Apache-2.0
declares:
  permissions: edit
  network: false
  executors: []
requires:
  runners:
    - name: planner
    - name: executor
    - name: mechanical
    - name: reviewer
    - name: reviewer-alt
contents:
  workflows:
    - .yunta/workflows/fragua.yaml
  docs:
    - README.md
