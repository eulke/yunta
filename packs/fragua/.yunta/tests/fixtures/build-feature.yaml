# One script per session `quick` mode spawns, selected by prompt: the
# planner's three sessions and the executor's one task. A mode that
# stops earlier opens fewer, and reads a fixture of its own — a fixture
# describing a session nobody opened describes a run nobody made.
#
# The planner hands its interpreted artifacts over through run tools, so
# the fixture declares that capability; only `brief.md`, an opaque
# artifact, is a file a session writes itself. `grill` asks nothing, so
# nobody has to answer for the case to run to its end.
capabilities: { run_tools: true }
sessions:
  - match_prompt_contains: "ambiguities"
    steps:
      - { type: run_tool, tool: yunta_submit_questions, arguments: { document: { questions: [] } } }
    outcome: { type: completed, summary: "nothing to ask" }
  - match_prompt_contains: "Write the brief"
    effects:
      - { path: "{{run.staging}}/brief/brief.md", content: "# Brief\n\nAdd dark mode.\n" }
    outcome: { type: completed, summary: "brief written" }
  - match_prompt_contains: "tasks document"
    steps:
      - type: run_tool
        tool: yunta_submit_tasks
        arguments:
          document:
            tasks:
              - id: T001
                title: "Bootstrap the crate"
                scope: ["Cargo.toml", "src/**"]
                criteria:
                  - cmd: "test -f Cargo.toml"
                  - cmd: "test -f src/lib.rs"
    outcome: { type: completed, summary: "tasks document registered" }
  - match_prompt_contains: "Read your task from the tasks document"
    effects:
      - path: Cargo.toml
        content: |
          [package]
          name = "sandbox"
          version = "0.1.0"
          edition = "2021"
      - path: src/lib.rs
        content: |
          /// Whether the interface renders in dark mode.
          pub fn dark_mode() -> bool {
              true
          }
    outcome: { type: completed, summary: "crate bootstrapped" }
