# The full reference pipeline (yunta/fragua) — a runnable copy of the
# schema's own canonical example (also crates/core/tests/fixtures/
# build-feature.yaml, the parse fixture). Two deliberate trims from that
# reference: the `mcp:` context source is dropped (it needs a live MCP
# server, which a pack's own mock self-test has no reason to stand up)
# and `node_defaults.hooks` is dropped (an ecosystem-specific
# convenience, not something a reference pack needs to demonstrate).
# Two additions. `spec` writes the tests the plan's tasks are held to
# before any is built, in the modes that approve the plan: the person
# approving it reads the tests beside it, and nobody who builds a task
# writes the test that judges it. `conform` holds what the run built to
# the plan a person approved before the pull request is asked for, in
# every mode — green criteria say the work passes its tests, not that it
# is what the plan says, and a departure nobody declared is what a
# person approving the pull request would miss.
#
# A pack runs in repositories its author has never seen, so it names
# capabilities and never a tool or a layout: `lint` runs whatever the
# project declares as its `lint` command, and a project that declares
# none runs without it; `fix-lint` may edit what the run itself changed;
# `pr` opens its pull request through the project's forge; and `plan`
# reads `docs/architecture.md` as optional, since the planner can explore
# the code without it.
name: fragua
description: Full feature cycle — grill, verified tasks document, lint/fix, baseline, multi-runner review, the work held to its plan, PR
yunta_schema: ">=1 <2"
inputs:
  idea:
    type: string
    required: true
    description: "What to build — becomes the brief"

modes:
  quick:    { include: [grill, brief, plan, implement, lint, fix-lint, tests, conform, ship, pr] }
  standard: { include: [grill, brief, plan, spec, approve-plan, implement, lint, fix-lint, tests, review, conform, fix-findings, ship, pr] }
  full:     { include: all }

nodes:
  - id: grill
    kind: prompt
    runner: planner
    prompt: |
      Identify the ambiguities in "{{inputs.idea}}" and raise the questions
      you need; don't converse.
    artifacts:
      produces: [questions]

  - id: brief
    kind: prompt
    runner: planner
    depends_on: [grill]
    context:
      - artifact: { node: grill, kind: questions }
      - artifact: { node: grill, kind: answers }
    prompt: |
      Write the brief for "{{inputs.idea}}" from the questions and their
      answers.
    artifacts:
      produces: [brief.md]

  - id: plan
    kind: prompt
    runner: planner
    permissions: read-only
    depends_on: [brief]
    context:
      - artifact: { node: brief, name: brief.md }
      - knowledge: {}
      - files: [{ path: docs/architecture.md, optional: true }]
      - command: "git log --oneline -20"
    prompt: { file: prompts/plan.md }
    artifacts:
      produces: [tasks]

  - id: spec
    kind: prompt
    runner: planner
    permissions: read-only
    depends_on: [plan]
    context:
      - artifact: { node: plan, kind: tasks }
      - knowledge: {}
    prompt: { file: prompts/spec.md }
    artifacts:
      produces: [spec]

  - id: approve-plan
    kind: gate
    depends_on: [spec]
    assignee: lead
    message: "Plan and its tests registered. Approve?"
    options: [approve, adjust]
    on: { adjust: plan }
    shows:
      - { node: plan, kind: tasks }
      - { node: spec, kind: spec }

  - id: implement
    kind: loop
    runner: executor
    depends_on: [approve-plan]
    until: all_tasks_complete
    invariant: true
    concurrency: 2
    scope_expansion:
      mode: ask
      max_per_run: 3
    prompt: |
      Read your task from the tasks document. Implement it inside its own scope.

  - id: lint
    kind: bash
    invariant: true
    optional: true
    depends_on: [implement]
    run: { command: lint }
    on_failure: { goto: fix-lint, max_reroutes: 1 }

  - id: fix-lint
    kind: prompt
    runner: mechanical
    context: [{ node-output: { node: lint } }]
    prompt: "Fix exclusively the errors in the report."
    scope: run

  - id: tests
    kind: check
    builtin: baseline_compare
    invariant: true
    depends_on: [lint]

  - id: review
    kind: prompt
    depends_on: [tests]
    runners: [reviewer, reviewer-alt]
    permissions: read-only
    prompt: "Audit the changes and report what you find."
    artifacts:
      produces: [findings]

  - id: conform
    kind: prompt
    runner: reviewer
    permissions: read-only
    depends_on: [tests]
    context:
      - artifact: { node: plan, kind: tasks }
      - run-events: { filter: deviations }
      - command: "git diff {{run.base}}"
    prompt: { file: prompts/conform.md }
    artifacts:
      produces: [findings]

  - id: fix-findings
    kind: prompt
    runner: executor
    depends_on: [review, conform]
    context:
      - run-events: { filter: findings }
    prompt: "Fix blocking findings; document discarded ones with a reason."

  - id: ship
    kind: gate
    depends_on: [fix-findings]
    assignee: lead
    message: "The work, held to its plan. Create the PR?"
    shows:
      - { node: plan, kind: tasks }
      - { node: conform, kind: findings }

  - id: pr
    kind: pull_request
    depends_on: [ship]
    title: "{{inputs.idea}}"

on_finish:
  - cleanup: worktree
  - distill: [{ node: plan, kind: tasks }]
