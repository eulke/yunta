name: review
description: >-
  Fan-out review — the same prompt runs once per declared runner
  (`runners:`), each producing its own findings independently, so
  a second opinion never anchors on the first.
nodes:
  - id: review
    kind: prompt
    runners: [reviewer, reviewer-alt]
    permissions: read-only
    prompt: |
      Audit the current changes. Post findings to
      {{run.dir}}/artifacts/findings-{{runner.role}}.yaml
    artifacts:
      produces:
        - { name: "findings-{{runner.role}}.yaml", kind: findings }
