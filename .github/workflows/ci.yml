name: CI

on:
  pull_request:
  # The release gate runs these same checks by calling this workflow,
  # so the two can never drift into testing different things.
  workflow_call:

# A newer commit supersedes an earlier PR check. A reusable release check
# uses its caller's ref and never cancels the release that called it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history: the smell check reads the baseline of the merge
      # base, so a change cannot raise a count and the baseline together.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Installs the toolchain `rust-toolchain.toml` pins, with its
      # components, and caches the build.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          rustflags: ""

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: build (workspace)
        run: cargo build --workspace --locked

      - name: the committed schemas are what the types emit
        run: cargo xtask schema --check

      - name: the audit's smell counts have not risen
        run: cargo xtask smells --check

      - name: the agent docs hold
        run: cargo xtask docs --check

      - name: the decisions and their index agree
        run: cargo xtask adr --check

      # Private items too: a module's `//!` and an item's `///` are where
      # this repository explains its code, and a link in one must resolve.
      - name: rustdoc has no warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items --locked

      - name: test (workspace)
        run: cargo test --workspace --locked --no-fail-fast

      - name: the repository's own workflows and every pack pass check and their cases
        run: |
          yunta="cargo run --locked -q -p yunta --"
          for wf in .yunta/workflows/*.yaml packs/*/.yunta/workflows/*.yaml; do
            $yunta check "$wf"
          done
          $yunta test
          for pack in packs/*/; do
            echo "::group::test --dir $pack"
            $yunta test --dir "$pack"
            echo "::endgroup::"
          done

      - name: check each crate in isolation
        run: |
          for crate in yunta-core yunta-storage yunta-adapters yunta-engine yunta xtask; do
            echo "::group::cargo check -p $crate"
            cargo check -p "$crate" --locked
            echo "::endgroup::"
          done

  # The release profile is not the debug one: an overflow check that
  # only fires in debug, or a panic strategy that only exists there,
  # is a difference the product ships. One crate is enough to keep
  # the profile compiling and passing. It is the slowest step of the
  # suite, so it runs beside `ci` rather than after it.
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          rustflags: ""
      - name: test (release profile)
        run: cargo test --release --locked -p yunta-core

  # The suite runs on the other platform the product ships on: a test
  # that passes only on Linux is a test about Linux.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          rustflags: ""
      - name: test (workspace)
        run: cargo test --workspace --locked --no-fail-fast

  # musl is what makes the Linux release binary a real static binary (no
  # glibc dependency at runtime) — a link failure here is a
  # release-blocking regression, not just a style nit, so it gets its own
  # job rather than riding along inside `ci`.
  musl-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: x86_64-unknown-linux-musl
          build-warnings: ""
          rustflags: ""
      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: build (static musl)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p yunta

      - name: verify static linking
        run: |
          file target/x86_64-unknown-linux-musl/release/yunta
          ! ldd target/x86_64-unknown-linux-musl/release/yunta 2>&1 | grep -q "=>" || {
            echo "::error::yunta linked against shared libraries — not a static musl binary"
            exit 1
          }

      # The ceiling fails only on a dependency that is enormous, not on the
      # system's ordinary growth. The static musl release binary measured
      # 36.1 MiB (37,865,856 bytes) in October 2026, all of it the
      # workspace's own code and the dependencies it uses, so the ceiling
      # sits above that with room for ordinary growth. The size is printed
      # on every run, which keeps the history.
      - name: binary size stays under its ceiling
        run: |
          ceiling=41943040
          bytes=$(stat -c %s target/x86_64-unknown-linux-musl/release/yunta)
          echo "yunta (static musl, release): $((bytes / 1024 / 1024)) MiB ($bytes bytes; ceiling $ceiling bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt "$ceiling" ]; then
            echo "::error::yunta is $bytes bytes, over the $ceiling-byte ceiling — find the dependency that grew the static binary"
            exit 1
          fi
