[package]
name = "yunta-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded event log storage for Yunta runs."

[lints]
workspace = true

[dependencies]
yunta-core.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
# Async code reaches the log through `spawn_blocking` (D122): the runtime's
# threads never wait on SQLite. Only the runtime feature the hop needs.
tokio = { workspace = true, features = ["rt"] }

[features]
# Fault-injection test support (corrupting a stored event to break the
# hash chain), compiled only into test builds that ask for it — never a
# capability a production binary carries.
testkit = []

[dev-dependencies]
# Storage's own tests reach that fault injection through the feature, the
# way `yunta-core` enables its own `testkit` feature for its tests.
yunta-storage = { path = ".", features = ["testkit"] }
yunta-core = { workspace = true, features = ["testkit"] }
# The shared test harness: the fixed clock store tests time events with.
yunta-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
