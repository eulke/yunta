[package]
name = "yunta-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded event log storage for Yunta runs."

[lints]
workspace = true

[dependencies]
yunta-core.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
# Async code reaches the log through `spawn_blocking` (D122): the runtime's
# threads never wait on SQLite. Only the runtime feature the hop needs.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
yunta-core = { workspace = true, features = ["testkit"] }
# The shared test harness: the fixed clock store tests time events with.
yunta-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
