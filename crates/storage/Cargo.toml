[package]
name = "yunta-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded event log storage for Yunta runs."

[dependencies]
yunta-core = { path = "../core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
