[package]
name = "yunta-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Yunta workflow engine: scheduler, verification cycle, resumability."

[dependencies]
yunta-core = { path = "../core" }
yunta-storage = { path = "../storage" }
yunta-adapters = { path = "../adapters" }
thiserror = "2"
futures = "0.3"
globset = "0.4"
# The engine interprets `kind: task-ledger` artifacts at node close
# (Contrato §4.1) — runtime YAML parsing, not just test fixtures.
serde_yaml = "0.9"
# `kind: executor`'s stdin/stdout contract is JSON by definition (D47) —
# already a dependency of yunta-core/yunta-adapters/yunta-storage at the
# same version, not a new one to the workspace.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1", features = ["process", "rt", "macros", "time"] }
# CancellationToken (T4.6, `join: any`'s interrupt→kill of the losing
# siblings) — the propagated-cancellation primitive CLAUDE.md's own
# "Concurrencia estructurada" section names, not a new idiom.
tokio-util = "0.7"
# `mcp:` context source (§9, T6.2) — an outbound streamable-HTTP MCP
# client, the transport the reference config's own `mcp_servers:` shape
# uses (a `url:` + bearer `auth_env:`, never stdio). `client` +
# `transport-streamable-http-client-reqwest` only: no server-side
# feature here, so nothing from this ships tower/hyper into the release
# binary — those stay dev-only, for the toy server tests spawn (below).
rmcp = { version = "3", default-features = false, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
# `reqwest::Client` is named directly in `context_resolve.rs` to build the
# streamable-HTTP transport rmcp's own reqwest feature only wires
# internally — rustls (not native-tls/OpenSSL), matching the TLS backend
# the `reqwest` feature above already selects for rmcp's side.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# `inputs:`'s `pattern:` validation (T1.5, §2.3, D82) — the one place the
# workspace validates a user-supplied regex against a string; nothing
# already in the dependency tree exposes that.
regex = "1"

[dev-dependencies]
chrono = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
# Toy MCP server (T6.2's own ✓: "test contra server MCP de juguete") —
# server-side features only, additive on the same `rmcp` dependency edge;
# cargo unifies them for test builds and drops them entirely from
# `cargo build --release` of the real `yunta` binary.
rmcp = { version = "3", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
# Binds the toy server's `StreamableHttpService` (a tower `Service`) to a
# real `127.0.0.1:0` listener for the T6.2 test — dev-only, same as the
# `rmcp` server features above; never reaches the release binary.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
