[package]
name = "yunta-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Yunta workflow engine: scheduler, verification cycle, resumability."

[dependencies]
yunta-core = { path = "../core" }
yunta-storage = { path = "../storage" }
yunta-adapters = { path = "../adapters" }
thiserror = "2"
futures = "0.3"
globset = "0.4"
# The engine interprets `kind: task-ledger` artifacts at node close
# (Contrato §4.1) — runtime YAML parsing, not just test fixtures.
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "rt", "macros"] }

[dev-dependencies]
chrono = "0.4"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
