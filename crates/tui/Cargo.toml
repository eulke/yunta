[package]
name = "yunta-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Yunta's application at a terminal: each screen yunta-ui makes, laid out in cells with Ratatui and drawn in Surco's lines, its keys read with crossterm, and the terminal held and given back."

# What a doc example shows, the crate's own tests assert: a doctest would
# build a binary of its own to say it again.
[lib]
doctest = false

[lints]
workspace = true

[dependencies]
# The clock the application is handed, which the time it hands in is read from.
yunta-core.workspace = true
# The application it shows: what a person has open, what a stroke does, the work it asks.
yunta-ui.workspace = true
# Every line written into a cell, and the one table its color is read from.
yunta-surco.workspace = true
# The cells a screen is laid out in, and the frame written to the terminal; each layout
# solved once for its size, kept in Ratatui's cache, since a screen redraws on every change.
ratatui = { workspace = true, features = ["crossterm", "layout-cache"] }
# The terminal's keys, pastes and size, read as a stream, and its modes held and given back.
crossterm = { workspace = true, features = ["event-stream"] }
# The loop: what arrives selected over, the time on a tick, the performer's channel.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
# The terminal's events, read as the stream the loop selects over.
futures.workspace = true
# The signal that stops the process on Ctrl-Z, once the terminal is given back.
nix.workspace = true

[dev-dependencies]
# The states the target frames show, and the walk over every state the application reaches.
yunta-testkit-ui.workspace = true
# A deep stack for the work a screen's state is built by, and the pseudo-terminal a test
# runs its own binary on.
yunta-testkit.workspace = true
# The directory a test's binary, run again in a pseudo-terminal, works in.
tempfile.workspace = true
# A clock that stands still, for the application run again in a pseudo-terminal.
yunta-testkit-core.workspace = true
# The runtime the application run again runs on, and the terminate it is asked to end by.
tokio = { workspace = true, features = ["rt", "signal"] }
