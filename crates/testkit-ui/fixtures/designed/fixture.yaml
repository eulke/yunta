          //! Packs: where they are installed, and the lock that records them.

          use std::path::{Path, PathBuf};

          use crate::error::PackError;
          use crate::state::user_state_root;

          /// Where a pack command installs: the project's store, or the user's own.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum PackTarget {
              Project,
              Global,
          }

          /// The directory a target's packs are vendored under.
          pub fn pack_target_root(target: PackTarget, cwd: &Path) -> Result<PathBuf, PackError> {
              match target {
                  PackTarget::Project => Ok(cwd.join(".yunta/packs")),
                  PackTarget::Global => Ok(user_state_root()?.join("packs")),
              }
          }

          /// The lock a target's installs are recorded in.
          pub fn pack_target_lock_path(target: PackTarget, cwd: &Path) -> Result<PathBuf, PackError> {
              match target {
                  PackTarget::Project => Ok(cwd.join(".yunta/yunta.lock")),
                  PackTarget::Global => Ok(user_state_root()?.join("yunta.lock")),
              }
          }

          fn packs_root(cwd: &Path) -> PathBuf {
              cwd.join(".yunta/packs")
          }

          fn vendor_dir(cwd: &Path, pack: &PackRef) -> PathBuf {
              packs_root(cwd).join(pack.as_path())
          }
