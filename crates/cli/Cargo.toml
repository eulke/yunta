[package]
name = "yunta"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Yunta — a deterministic workflow engine for code agents."

[[bin]]
name = "yunta"
path = "src/main.rs"

[dependencies]
yunta-core = { path = "../core" }
yunta-engine = { path = "../engine" }
yunta-adapters = { path = "../adapters" }
yunta-storage = { path = "../storage" }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# `yunta stats --json` (T7.5, §8.4) — already a transitive dependency of
# every crate here via `yunta-engine`, made direct now that the CLI
# serializes its own JSON DTOs rather than only ever deserializing YAML.
serde_json = "1"
# `yunta test` sandboxes each case in a throwaway worktree/runs root.
tempfile = "3"
thiserror = "2"
# `yunta run`/`resume`/`test` drive the async engine; a current-thread
# runtime is all the sequential M-0 scheduler needs.
tokio = { version = "1", features = ["rt", "macros", "signal", "time"] }
# CancellationToken for the Ctrl-C -> root-token bridge (DI-08); the
# engine already speaks this type on its execute_run surface.
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `ConsoleInteraction` (T7.2) implements `yunta_engine::HumanInteraction`,
# whose method is dyn-safe async — same reason yunta-engine/yunta-adapters
# already depend on this.
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
