[package]
name = "yunta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Yunta: a deterministic workflow engine for code agents."

[lints]
workspace = true

[[bin]]
name = "yunta"
path = "src/main.rs"

[dependencies]
yunta-core.workspace = true
yunta-replay.workspace = true
# What can be asked of Yunta, handed the workspace this process reads once.
yunta-api.workspace = true
# The control plane `yunta mcp` serves on stdio.
yunta-mcp.workspace = true
# The prompts a person answers stroke by stroke, which the console holds.
yunta-ui.workspace = true
yunta-render.workspace = true
yunta-surco = { workspace = true, features = ["clap"] }
clap = { workspace = true, features = ["derive"] }
clap_complete.workspace = true
chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
# The documents a command writes as JSON, and the JSON a test reads back.
serde_json.workspace = true
thiserror.workspace = true
# `yunta run`/`resume`/`test` drive the async engine; a current-thread
# runtime is all the sequential scheduler needs.
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "process"] }
# `CancellationToken`: each stage of the API's `Stop` the interrupt trips,
# and what a prompt or a follower waits on beside its work.
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The live view's pinned region: a few lines of plain text held at the
# bottom of the terminal while finished work scrolls above them into the
# terminal's own history. It draws to stderr, leaving stdout for whatever
# a caller pipes, and it goes silent by itself when that stream is not a
# terminal. It takes no alternate screen, no raw mode and no mouse
# capture, which is what leaves the operator's scrollback, text selection
# and typed Ctrl-C exactly as they were.
indicatif.workspace = true
# Reads a key at a time, for the prompts a gate and a questions artifact need. Already in the tree through indicatif.
console.workspace = true
# `ConsoleInteraction` implements `yunta_core::port::HumanInteraction`, whose
# method is dyn-safe async, as every crate implementing a port depends on it.
async-trait.workspace = true
# A prompt's key read turns the terminal's line discipline off, and a
# read abandoned mid-key never turns it back on: this is what reads the
# mode the console was handed and sets it back, on the one path the read
# itself cannot reach. `term` alone — the signal and process halves stay
# behind `yunta-adapters`, which already puts this crate in the binary,
# so nothing new is linked in.
nix = { workspace = true, features = ["term", "poll"] }
# `yunta mcp` serves the control plane on stdio: `server` and
# `transport-io` only, no HTTP transport and no client.
rmcp = { workspace = true, features = ["server", "transport-io"] }

[dev-dependencies]
# The same region, drawn into a buffer instead of a terminal, so a test
# asserts on what a reader would see with nothing to wait for and no
# terminal to stand up.
indicatif = { workspace = true, features = ["in_memory"] }
yunta-core = { workspace = true, features = ["testkit"] }
# A surface test builds the frame it draws from the frame's samples.
yunta-replay = { workspace = true, features = ["testkit"] }
# `verify`'s broken-chain test corrupts a stored event behind the store's
# back through the same fault injector storage's own tests use.
yunta-storage = { workspace = true, features = ["testkit"] }
# What a test stages below the API before a command reads it: a run the
# engine drove, a registry an engine wrote, a scripted adapter.
yunta-engine.workspace = true
yunta-adapters.workspace = true
# The shared test harness: git-repo fixture, `yunta_in!`, fixed clock.
yunta-testkit.workspace = true
yunta-testkit-core.workspace = true
# The instant the application's tests stand at, and a state driven with its performer.
yunta-testkit-ui.workspace = true
yunta-surco = { workspace = true, features = ["clap", "golden"] }
tempfile.workspace = true
# Tests write their workflows and configs as YAML literals.
# `yunta mcp`'s own end-to-end test: a real stdio JSON-RPC round trip
# against the binary, spawned as a child process — the same combination
# rmcp documents for testing a stdio server from the outside.
rmcp = { workspace = true, features = [
    "client",
    "transport-child-process",
] }
