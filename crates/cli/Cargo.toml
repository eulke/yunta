[package]
name = "yunta"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Yunta — a deterministic workflow engine for code agents."

[[bin]]
name = "yunta"
path = "src/main.rs"

[dependencies]
yunta-core = { path = "../core" }
yunta-engine = { path = "../engine" }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
