[package]
name = "yunta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Yunta — a deterministic workflow engine for code agents."

[lints]
workspace = true

[[bin]]
name = "yunta"
path = "src/main.rs"

[dependencies]
yunta-core.workspace = true
yunta-engine.workspace = true
yunta-adapters.workspace = true
yunta-storage.workspace = true
clap = { workspace = true, features = ["derive"] }
chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
# `yunta stats --json` — already a transitive dependency of every crate
# here via `yunta-engine`, made direct now that the CLI serializes its
# own JSON DTOs rather than only ever deserializing YAML.
serde_json.workspace = true
# `yunta test` sandboxes each case in a throwaway worktree/runs root.
tempfile.workspace = true
thiserror.workspace = true
# `yunta run`/`resume`/`test` drive the async engine; a current-thread
# runtime is all the sequential scheduler needs.
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "process"] }
# CancellationToken for the Ctrl-C -> root-token bridge; the engine
# already speaks this type on its execute_run surface.
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# `ConsoleInteraction` implements `yunta_engine::HumanInteraction`, whose
# method is dyn-safe async — same reason yunta-engine/yunta-adapters
# already depend on this.
async-trait.workspace = true
# `yunta mcp`: the control-plane MCP server, stdio. `server` +
# `transport-io` only — no HTTP transport, no client features: the
# per-run MCP server is a separate, later concern with its own
# transport (HTTP loopback).
rmcp = { workspace = true, features = ["server", "transport-io"] }

[dev-dependencies]
yunta-core = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
# Tests write their workflows and configs as YAML literals.
serde_yaml.workspace = true
# `yunta mcp`'s own end-to-end test: a real stdio JSON-RPC round trip
# against the binary, spawned as a child process — the same combination
# rmcp documents for testing a stdio server from the outside.
rmcp = { workspace = true, features = [
    "client",
    "transport-child-process",
] }
# The console-interaction test drives `yunta run` with a real terminal on
# stdin (openpty) so the console surface engages, then signals it (SIGINT)
# to prove the runtime stays responsive while a prompt waits.
nix = { workspace = true, features = ["term", "signal"] }
