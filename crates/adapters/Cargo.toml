[package]
name = "yunta-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Adapter trait and CLI integrations (claude-code, codex, mock) for Yunta."

[lints]
workspace = true

[dependencies]
yunta-core.workspace = true
async-trait.workspace = true
futures.workspace = true
tracing.workspace = true
# "process"/"io-util" drive the real `claude-code` subprocess:
# spawning it, streaming its stdout, and reaping it on exit.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "process", "io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# `codex exec -c key=value` takes TOML values on the command line, and a
# path or a URL that carries a `"` or a `\` has to reach the CLI escaped.
# Rendering only — the parser stays out of the binary.
toml = { workspace = true }
# `GitHubForge`: the REST calls that publish artifacts, open a PR and
# poll its review state — same TLS backend `yunta-engine` already
# selects for its own outbound HTTP (rustls, not native-tls).
reqwest = { workspace = true, features = [
    "json",
    "rustls",
] }
# GitHub's Contents API takes file bodies base64-encoded — the one place
# this crate needs to produce that encoding.
base64.workspace = true
# Signals to processes and process groups (`signal.rs`): the kernel's
# own `errno` instead of a `kill` binary's exit status, with no unsafe
# code of ours (D118). Already in the tree through `rmcp`.
nix.workspace = true
# The mock's `run_tool` fixture step: the mock acts as a real MCP client
# against the engine's per-run listener, over the same streamable-HTTP
# transport a real CLI would use — the whole per-run tool path stays
# exercisable in CI without an LLM. Same features (and the same
# already-in-tree crates) as `yunta-engine`'s own outbound MCP client.
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }

[dev-dependencies]
# The tests read back what `config.rs` renders, which needs the parser
# the adapter itself has no use for.
toml = { workspace = true, features = ["parse"] }
yunta-core = { workspace = true, features = ["testkit"] }
# The GitHub forge's tests answer its HTTP calls from a local stub of
# the API — the same crate the engine's per-run MCP listener already
# builds on, so nothing new enters the tree.
axum = { workspace = true, features = ["tokio", "http1", "json", "query"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
