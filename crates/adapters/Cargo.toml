[package]
name = "yunta-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Adapter trait and CLI integrations (claude-code, codex, mock) for Yunta."

[lints]
workspace = true

[dependencies]
yunta-core.workspace = true
async-trait.workspace = true
futures.workspace = true
tracing.workspace = true
# "process"/"io-util" drive the real `claude-code` subprocess:
# spawning it, streaming its stdout, and reaping it on exit.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "process", "io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# `GitHubForge`: the REST calls that publish artifacts, open a PR and
# poll its review state — same TLS backend `yunta-engine` already
# selects for its own outbound HTTP (rustls, not native-tls).
reqwest = { workspace = true, features = [
    "json",
    "rustls",
] }
# GitHub's Contents API takes file bodies base64-encoded — the one place
# this crate needs to produce that encoding.
base64.workspace = true
# The mock's `run_tool` fixture step: the mock acts as a real MCP client
# against the engine's per-run listener, over the same streamable-HTTP
# transport a real CLI would use — the whole per-run tool path stays
# exercisable in CI without an LLM. Same features (and the same
# already-in-tree crates) as `yunta-engine`'s own outbound MCP client.
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }

[dev-dependencies]
yunta-core = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
