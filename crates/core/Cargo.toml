[package]
name = "yunta-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared domain types for Yunta, the deterministic workflow engine for code agents."

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
# The port is an async trait whose sessions hand back a stream of
# events: `async-trait` is how a trait declares an async method on
# stable Rust, and `futures` is the `BoxStream` that stream is.
async-trait.workspace = true
futures.workspace = true
# `process::subprocess` spawns a CLI, reads its stdout line by line and
# reaps it: the same "process"/"io-util" halves the adapters used before
# the module moved here, plus the task and channel the reader runs on.
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "io-util"] }
# Signals to processes and process groups (`process::signal`): the
# kernel's own `errno` instead of a `kill` binary's exit status, with no
# unsafe code of ours (D118).
nix.workspace = true
# A subprocess's stderr is drained to the trace log rather than dropped.
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
sha2.workspace = true
# `modes:` is an ordered map, free in name and count — its
# declaration order *is* the promotion ladder, so plain iteration order
# has to survive parse. Already in the workspace's own dependency graph
# transitively (schemars, reqwest); making it direct here costs nothing
# new and buys exactly the ordered-map-with-serde semantics needed.
indexmap = { workspace = true, features = ["serde"] }
# YAML is the authoring format of every type in this crate; the parser
# lives next to them so the whole workspace reads and writes YAML through
# one module, and a document's parse error carries the failing key's path.
serde_norway.workspace = true
# Every scope glob in the workspace compiles through one rule that lives
# next to the schema declaring it; the engine and the mock consume it.
globset.workspace = true
# Names the path of a value that failed inside an already-buffered
# `Value` — the one place the parser's own path tracking cannot reach.
serde_path_to_error.workspace = true
# Run ids are ULIDs (time-ordered, one path segment, collision-free across
# processes). The crate is the encoding and the 48-bit millisecond
# arithmetic and nothing else; its randomness comes from `rand`, already
# in the workspace graph through `rmcp`.
ulid.workspace = true
# The JSON Schema of every document is generated from these types; the
# crate is already in the workspace graph through `rmcp`, with the same
# `chrono` support. `indexmap2` describes `modes:`, an ordered map.
schemars = { workspace = true, features = ["chrono04", "indexmap2"] }

[features]
# Unchecked `From<&str>`/`From<String>` for identifiers, so a test can
# write a literal; production code parses.
testkit = []

[dev-dependencies]
yunta-testkit-core.workspace = true
yunta-core = { path = ".", features = ["testkit"] }
proptest.workspace = true
