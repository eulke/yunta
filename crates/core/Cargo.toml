[package]
name = "yunta-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared domain types for Yunta, the deterministic workflow engine for code agents."

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
# `modes:` is an ordered map, free in name and count — its
# declaration order *is* the promotion ladder, so plain iteration order
# has to survive parse. Already in the workspace's own dependency graph
# transitively (schemars, reqwest); making it direct here costs nothing
# new and buys exactly the ordered-map-with-serde semantics needed.
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
serde_yaml = "0.9"
