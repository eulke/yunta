# The canonical reference workflow
# as a parse fixture — exercises the full round-trip criterion,
# including `runners:`.
name: build-feature
description: Complete feature with grill, verified tasks document, multi-runner review and PR
yunta_schema: ">=1 <2"
inputs:
  idea:
    type: string
    required: true
    description: "What to build — it becomes the brief"

modes:
  quick:    { include: [grill, brief, plan, implement, lint, fix-lint, tests, ship, pr] }
  standard: { include: [grill, brief, plan, approve-plan, implement, lint, fix-lint, tests, review, fix-findings, ship, pr] }
  full:     { include: all }

node_defaults:
  hooks:
    after:
      - run: "cargo fmt"

nodes:
  - id: grill
    kind: prompt
    runner: planner
    skills: [grill]
    prompt: |
      Identify the ambiguities in "{{inputs.idea}}" and write the questions
      needed as an artifact; do not converse.
    artifacts:
      produces: [questions]

  - id: brief
    kind: prompt
    runner: planner
    depends_on: [grill]
    context:
      - artifact: { node: grill, kind: questions }
      - artifact: { node: grill, kind: answers }
    prompt: |
      Write the brief for "{{inputs.idea}}" from the questions and their
      answers.
    artifacts:
      produces: [brief.md]

  - id: plan
    kind: prompt
    runner: planner
    permissions: read-only
    depends_on: [brief]
    context:
      - artifact: { node: brief, name: brief.md }
      - knowledge: {}
      - files: ["docs/architecture.md"]
      - command: "git log --oneline -20"
      - mcp: { server: internal-docs, query: "{{inputs.idea}}" }
    prompt: { file: prompts/plan.md }
    artifacts:
      produces: [tasks]

  - id: approve-plan
    kind: gate
    depends_on: [plan]
    assignee: lead
    message: "Plan recorded. Do you approve?"
    options: [approve, adjust]
    on: { adjust: plan }
    shows: [{ node: plan, kind: tasks }]

  - id: implement
    kind: loop
    runner: executor
    depends_on: [approve-plan]
    until: all_tasks_complete
    invariant: true
    concurrency: 2
    scope_expansion:
      mode: ask
      max_per_run: 3
    prompt: |
      Read your task in the tasks document. Implement it within its scope.

  - id: lint
    kind: bash
    invariant: true
    optional: true
    depends_on: [implement]
    run: { command: lint }
    on_failure: { goto: fix-lint, max_reroutes: 1 }

  - id: fix-lint
    kind: prompt
    runner: mechanical
    context: [{ node-output: { node: lint } }]
    prompt: "Fix only the errors in the report."
    scope: run

  - id: tests
    kind: check
    builtin: baseline_compare
    invariant: true
    depends_on: [lint]

  - id: review
    kind: prompt
    depends_on: [tests]
    runners: [reviewer, reviewer-alt]
    permissions: read-only
    prompt: "Audit the changes and report each finding."
    artifacts:
      produces: [findings]

  - id: fix-findings
    kind: prompt
    runner: executor
    depends_on: [review]
    context:
      - run-events: { filter: findings }
    prompt: "Fix the blocking findings; document each dismissed one with its reason."

  - id: ship
    kind: gate
    depends_on: [fix-findings]
    assignee: lead
    message: "Create the PR?"

  - id: pr
    kind: pull_request
    depends_on: [ship]
    title: "{{inputs.idea}}"

on_finish:
  - cleanup: worktree
  - distill: [{ node: plan, kind: tasks }]
