# What a node needs a person to decide. A node that needs an answer does
# not converse: it hands this document over and ends, and the engine asks.
# Written strictly — any key not listed here is refused.

questions:                              # required; an empty list is valid and
                                        #   means nothing needs deciding
  - id: theme-source                    # required, unique. A letter, then
                                        #   letters, digits, `_` or `-`.
    text: "Should dark mode follow the operating system setting?"  # required
    answer_type: boolean                # required, one of:
                                        #   text | choice | boolean
    required: true                      # required: a round with a `required`
                                        #   question pauses the run until a
                                        #   person answers; a round of optional
                                        #   ones does not pause it

  - id: accent-colour
    text: "Which accent colour should the dark theme use?"
    answer_type: choice
    values: ["teal", "amber", "violet"] # required when answer_type is `choice`,
                                        #   and an answer must be one of these
    required: false
    assumes: "teal, the brand's own accent"  # required when `required` is
                                        #   false: what the work takes as the
                                        #   answer when nobody gives one
